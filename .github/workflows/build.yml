name: Build SuperSU

on:
    push:
        branches: [main, master, app]
    pull_request:
        branches: [main, master, app]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        permissions:
            contents: write

        strategy:
            matrix:
                build_type: [release]

        steps:
            - name: Task :check:checkOut
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Task :setup:installDependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y python3 gh

            - name: Task :setup:installJava
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Task :app:buildApk
              run: |
                  if [ "${{ matrix.build_type }}" = "release" ]; then
                      python build.py -vr app
                  else
                      python build.py -v app
                  fi

            - name: Task :upload:uploadArtifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: supersu_${{ matrix.build_type }}
                  path: out/app-release.apk
                  compression-level: 9

            - name: Task :publish:writeGithubRelease
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ "${{ matrix.build_type }}" = "release" ]; then
                      tag="supersu"
                      title="SuperSU"
                      file="out/app-release.apk"
                  else
                      tag="canary_build"
                      title="canary_build"
                      file="out/app-debug.apk"
                  fi
                  commit=$(git rev-parse --short HEAD)
                  branch=${GITHUB_REF#refs/heads/}
                  build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
                  body=$(printf "SuperSU automated build\n\nBranch: %s\nCommit: %s\nBuild type: %s\nBuild time: %s\nActor: %s\nRepository: %s\nABIs: arm64-v8a, armeabi-v7a\n" \
                      "$branch" \
                      "$commit" \
                      "${{ matrix.build_type }}" \
                      "$build_time" \
                      "$GITHUB_ACTOR" \
                      "$GITHUB_REPOSITORY")
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release upload "$tag" "$file" --clobber
                      gh release edit "$tag" --title "$title" --notes "$body"
                  else
                      gh release create "$tag" "$file" \
                          --target "$GITHUB_SHA" \
                          --title "$title" \
                          --notes "$body"
                  fi
